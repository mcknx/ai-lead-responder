<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead sheet</title>
<style>
  :root { --ink:#1f2933; --muted:#667085; --line:#e4e7ec; --head:#f2f4f7; --brand:#1a7f4b; --new:#ecfdf3; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); }
  .icon { width:28px; height:28px; border-radius:6px; background:var(--brand); display:grid; place-items:center; }
  .icon i { width:14px; height:14px; border:2px solid #fff; border-radius:2px; background:linear-gradient(#fff,#fff) 0 50%/100% 2px no-repeat, linear-gradient(#fff,#fff) 50% 0/2px 100% no-repeat; }
  h1 { margin:0; font-size:17px; font-weight:600; }
  .meta { margin-left:auto; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--brand); animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; min-width:900px; }
  th, td { border:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left; overflow-wrap:anywhere; }
  th { background:var(--head); font-weight:600; color:#344054; position:sticky; top:0; }
  td.n, th.n { width:48px; text-align:center; color:var(--muted); background:var(--head); }
  td.reply { white-space:pre-wrap; }
  tr.new td { background:var(--new); } tr.new td.n { color:var(--brand); font-weight:700; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header><div class="icon"><i></i></div><h1>Lead sheet</h1><div class="meta"><span class="dot"></span><span id="st">Live · refreshes every 3 s</span></div></header>
<div class="wrap">
  <table>
    <colgroup><col class="n"><col style="width:13%"><col style="width:17%"><col style="width:24%"><col><col style="width:11%"></colgroup>
    <thead><tr><th class="n">#</th><th>Name</th><th>Email</th><th>Message</th><th>AI reply</th><th>Time</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
  </table>
</div>
<script>
const rows = document.getElementById("rows"), st = document.getElementById("st");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const time = t => t ? new Date(t).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
async function load() {
  try {
    const leads = await (await fetch("/leads")).json(); // newest first
    rows.innerHTML = leads.length ? leads.map((l, i) => `<tr${i ? "" : ' class="new"'}><td class="n">${esc(l.id)}</td><td>${esc(l.name)}</td><td>${esc(l.email)}</td><td>${esc(l.message)}</td><td class="reply">${esc(l.reply)}</td><td>${time(l.created_at)}</td></tr>`).join("")
      : '<tr><td colspan="6" class="empty">No leads yet.</td></tr>';
    st.textContent = "Live · refreshes every 3 s";
  } catch { st.textContent = "Offline · retrying…"; }
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
